site_name: graph-ted-db
site_description: Local property-graph storage for Python
site_url: https://graph-ted.com/db/   # eventual; local preview ignores this
repo_url: https://github.com/graph-ted/graph-ted-db
repo_name: graph-ted/graph-ted-db
edit_uri: ""

exclude_docs: |
  theme/README.md

theme:
  name: material
  custom_dir: overrides
  # Skip Google Fonts. Inter and JetBrains Mono are self-hosted from
  # docs/stylesheets/extra.css. Material's privacy plugin still fetches
  # fonts.googleapis.com during the build, so committed woff2 files keep
  # `mkdocs build --strict` offline.
  font: false
  # Full-color mark, same file the app navbar uses. The SVG's own
  # fallbacks are the teal strokes; page CSS does not cross into an <img>.
  logo: assets/logo.svg
  # SVG icon, plus docs/overrides/main.html adds favicon.ico for older clients.
  # 32px PNG sibling: docs/assets/favicon-32.png
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Overview: overview.md
      - Security: security.md
      - Quality: quality.md
      - On-disk format: format.md
      - Cypher: cypher.md
      - HTTP: http.md
  - API reference: api.md
  - Stack: stack.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_if_no_docstring: true
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            heading_level: 2

hooks:
  - scripts/llms_hook.py

extra_css:
  - stylesheets/extra.css
