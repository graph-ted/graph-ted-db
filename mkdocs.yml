site_name: graph-ted-db
site_description: Local property-graph storage for Python
# Published by the graph-ted.github.io build at /graph-ted-db/docs/. This
# repo's own GitHub Pages stays off: it would serve /graph-ted-db/ and collide
# with the org site. For a local preview at another path, set DOCS_SITE_URL,
# e.g. DOCS_SITE_URL=http://127.0.0.1:8002/db/ mkdocs serve -a 127.0.0.1:8002
site_url: !ENV [DOCS_SITE_URL, "https://graph-ted.com/graph-ted-db/docs/"]
repo_url: https://github.com/graph-ted/graph-ted-db
repo_name: graph-ted/graph-ted-db
edit_uri: ""

exclude_docs: |
  theme/README.md

# Linked from the footer (overrides/partials/copyright.html), not a nav tab.
not_in_nav: |
  trademarks.md

theme:
  name: material
  custom_dir: overrides
  # Skip Google Fonts. Inter and JetBrains Mono are self-hosted from
  # docs/stylesheets/extra.css. Material's privacy plugin still fetches
  # fonts.googleapis.com during the build, so committed woff2 files keep
  # `mkdocs build --strict` offline.
  font: false
  # Full-color mark, same file the app navbar uses. The SVG's own
  # fallbacks are the teal strokes; page CSS does not cross into an <img>.
  logo: assets/logo.svg
  # SVG icon, plus docs/overrides/main.html adds favicon.ico for older clients.
  # 32px PNG sibling: docs/assets/favicon-32.png
  favicon: assets/favicon.svg
  # Generic repo icon, not a third-party logo.
  icon:
    repo: material/source-repository
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Overview: overview.md
      - Security: security.md
      - Quality: quality.md
      - Sharing a graph: sharing.md
      - On-disk format: format.md
      - openCypher subset: cypher.md
      - HTTP: http.md
  - API reference: api.md
  - Stack: stack.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_if_no_docstring: true
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            heading_level: 2

hooks:
  - scripts/llms_hook.py

extra_css:
  - stylesheets/extra.css
  - stylesheets/header.css

# Footer: feedback links (text). The repo is private until
# launch, so these 404 for anyone without access.
copyright: >-
  Found a problem or have feedback?
  <a href="https://github.com/graph-ted/graph-ted-db/issues/new/choose">Open an issue</a>
  or <a href="https://github.com/graph-ted/graph-ted-db/discussions">start a discussion</a>.

# No brand icons in the footer: feedback links are text (copyright above),
# and overrides/partials/copyright.html adds the trademark line.
