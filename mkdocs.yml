site_name: graph-ted-db
site_description: Local property-graph storage for Python
site_url: https://graph-ted.com/db/   # eventual; local preview ignores this
repo_url: https://github.com/graph-ted/graph-ted-db
repo_name: graph-ted/graph-ted-db
edit_uri: ""

theme:
  name: material
  # 96px-tall @2x of the 48px nav wordmark. Header CSS displays it at 2rem.
  logo: assets/logo-nav-2x.png
  # Multi-resolution ICO (16/32/48). 32px PNG sibling: docs/assets/favicon-32.png
  favicon: assets/favicon.ico
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Overview: overview.md
      - Security: security.md
      - On-disk format: format.md
      - Cypher: cypher.md
      - HTTP: http.md
  - Stack: stack.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css
