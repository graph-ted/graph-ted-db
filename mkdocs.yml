site_name: graph-ted-db
site_description: Local property-graph storage for Python
site_url: https://graph-ted.com/db/   # eventual; local preview ignores this
repo_url: https://github.com/graph-ted/graph-ted-db
repo_name: graph-ted/graph-ted-db
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  # Skip Google Fonts. Inter and JetBrains Mono are self-hosted from
  # docs/stylesheets/extra.css. Material's privacy plugin still fetches
  # fonts.googleapis.com during the build, so committed woff2 files keep
  # `mkdocs build --strict` offline.
  font: false
  # White strokes. #009999 on the #007A7A header is 1.48:1, so an <img>
  # logo cannot use the themeable file (page CSS does not cross into it).
  logo: assets/logo-light-stroke.svg
  # SVG icon, plus docs/overrides/main.html adds favicon.ico for older clients.
  # 32px PNG sibling: docs/assets/favicon-32.png
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Overview: overview.md
      - Security: security.md
      - On-disk format: format.md
      - Cypher: cypher.md
      - HTTP: http.md
  - Stack: stack.md

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css
