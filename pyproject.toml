[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-ted-db"
version = "0.1.0"
description = "Local property-graph storage for Python. Data lives in a folder; open and query it in-process, with no database server for the default path."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "graph-ted-db contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
graph-ted-db = "graph_ted_db.cli:main"
graphted-db = "graph_ted_db.cli:main"

[tool.setuptools.packages.find]
include = ["graph_ted_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
