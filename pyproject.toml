[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphted-db"
version = "0.1.0"
description = "SQLite for graphs: a local file-based graph store and lightweight Neo4j/FalkorDB substitute for simple, prototype, and trusted workgroup use"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "graph-ted-db contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
graphted-db = "graph_ted_db.cli:main"
graph-ted-db = "graph_ted_db.cli:main"

[tool.setuptools.packages.find]
include = ["graph_ted_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
