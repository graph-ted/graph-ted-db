[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-ted-db"
version = "0.1.0"
description = "Local property-graph storage for Python. Data lives in a folder; open and query it in-process, with no database server for the default path."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "graph-ted-db contributors" }]
keywords = ["graph", "property-graph", "graph-database", "opencypher", "local-first", "embedded"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = []

[project.urls]
Homepage = "https://graph-ted.com/graph-ted-db/"
Documentation = "https://graph-ted.com/graph-ted-db/docs/"
Source = "https://github.com/graph-ted/graph-ted-db"
Issues = "https://github.com/graph-ted/graph-ted-db/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
graph-ted-db = "graph_ted_db.cli:main"
graphted-db = "graph_ted_db.cli:main"

[tool.setuptools.packages.find]
include = ["graph_ted_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
