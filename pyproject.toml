[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-ted-db"
version = "0.1.0"
description = "Local property-graph storage for Python. Data lives in a folder; open and query it in-process, with no database server for the default path."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "graph-ted-db contributors" }]
keywords = ["graph", "property-graph", "graph-database", "opencypher", "local-first", "embedded"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = []

[project.urls]
Homepage = "https://graph-ted.com/graph-ted-db/"
Documentation = "https://graph-ted.com/graph-ted-db/docs/"
Source = "https://github.com/graph-ted/graph-ted-db"
Issues = "https://github.com/graph-ted/graph-ted-db/issues"
Changelog = "https://github.com/graph-ted/graph-ted-db/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
graph-ted-db = "graph_ted_db.cli:main"
graphted-db = "graph_ted_db.cli:main"

[tool.setuptools.packages.find]
include = ["graph_ted_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
# Optional extra: graphiti-core is only needed for graph_ted_db.driver.graphiti.
module = ["graphiti_core", "graphiti_core.*"]
ignore_missing_imports = true
