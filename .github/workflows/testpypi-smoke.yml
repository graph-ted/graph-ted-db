name: testpypi-smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to install from TestPyPI"
        required: true
        default: "0.1.0"

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean venv install from TestPyPI
        run: |
          python -m venv "$RUNNER_TEMP/v"
          if [ -f "$RUNNER_TEMP/v/Scripts/python.exe" ]; then PY="$RUNNER_TEMP/v/Scripts/python.exe"; else PY="$RUNNER_TEMP/v/bin/python"; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install -q --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "graph-ted-db==${{ inputs.version }}"
      - name: Quick start
        run: |
          cd "$RUNNER_TEMP"
          "$PY" "$GITHUB_WORKSPACE/scripts/quickstart_smoke.py"
          "$PY" -m graph_ted_db --version || true
          d="$RUNNER_TEMP/cli-graph"
          "$(dirname "$PY")/graph-ted-db" init "$d" --name demo --exist-ok
          "$(dirname "$PY")/graph-ted-db" put-node "$d" --label Person --prop name=Alice
          "$(dirname "$PY")/graph-ted-db" ls-nodes "$d" | grep -q Alice && echo "cli OK"
