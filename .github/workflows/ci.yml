name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # THE SWITCH. While the repo is private, pull requests run a trimmed set
  # (Linux, Python 3.10 and 3.13, one wheel install) to save Actions minutes;
  # push to main, release tags and manual runs always get the full matrix
  # (3 OS x 3.10-3.14 tests, 30 install jobs). After the repo goes public
  # (minutes are free), set this to "true". See docs/RELEASING.md.
  FULL_MATRIX_ON_PULL_REQUESTS: "false"

jobs:
  plan:
    name: plan matrix
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.m.outputs.tests }}
      installs: ${{ steps.m.outputs.installs }}
    steps:
      - id: m
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "$FULL_MATRIX_ON_PULL_REQUESTS" = "true" ]; then
            tests='[{"os":"ubuntu-latest","python":"3.10"},{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.14"},{"os":"macos-latest","python":"3.13"},{"os":"windows-latest","python":"3.13"}]'
            installs=$(python3 -c 'import json; print(json.dumps([{"os":o,"python":p,"artifact":a} for o in ["ubuntu-latest","macos-latest","windows-latest"] for p in ["3.10","3.11","3.12","3.13","3.14"] for a in ["wheel","sdist"]]))')
          else
            tests='[{"os":"ubuntu-latest","python":"3.10"}]'
            installs='[{"os":"ubuntu-latest","python":"3.13","artifact":"wheel"}]'
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "installs=$installs" >> "$GITHUB_OUTPUT"

  test:
    name: pytest (Python 3.13, full gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: PII scan
        run: python scripts/pii_scan.py

      - name: Design tokens are in sync
        run: python scripts/sync_tokens.py --check

      - name: Install docs tools
        run: python -m pip install -r requirements-docs.txt

      - name: Build docs
        run: mkdocs build --strict

      - name: Build and check the package (no upload)
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

  # Tests only, on the other supported Pythons and on macOS/Windows. The job
  # above stays the full gate (PII scan, tokens, docs, package build).
  matrix:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

  # Build once, then install the wheel and the sdist into clean venvs on every
  # supported OS and Python. No checkout on the install side beyond the README
  # and the check script, so a missing runtime dependency fails here.
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install:
    name: install ${{ matrix.artifact }} (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [plan, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.installs) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            README.md
            scripts/check_quickstart.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Clean venv and install
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$RUNNER_TEMP/venv/Scripts"; else bin="$RUNNER_TEMP/venv/bin"; fi
          echo "$bin" >> "$GITHUB_PATH"
          if [ "${{ matrix.artifact }}" = "wheel" ]; then pkg=$(ls dist/*.whl); else pkg=$(ls dist/*.tar.gz); fi
          "$bin/python" -m pip install --upgrade pip
          "$bin/python" -m pip install "$pkg"
      - name: No runtime dependencies
        run: |
          extra=$(python -m pip list --format=freeze --exclude-editable | grep -viE '^(pip|setuptools|wheel|graph[-_]ted[-_]db)==' || true)
          if [ -n "$extra" ]; then echo "unexpected runtime deps: $extra"; exit 1; fi
      - name: Import, CLI, quick start
        run: |
          cd "$RUNNER_TEMP"
          python -c "import graph_ted_db, sys; print(graph_ted_db.__name__, sys.version)"
          graph-ted-db --version
          graphted-db --help > /dev/null
          python "$GITHUB_WORKSPACE/scripts/check_quickstart.py" "$GITHUB_WORKSPACE/README.md"
