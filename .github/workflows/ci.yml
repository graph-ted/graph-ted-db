name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: PII scan
        run: python scripts/pii_scan.py

      - name: Design tokens are in sync
        run: python scripts/sync_tokens.py --check

      - name: Install docs tools
        run: python -m pip install -r requirements-docs.txt

      - name: Build docs
        run: mkdocs build --strict

      - name: Build and check the package (no upload)
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
