name: Docs problem
description: Something in the documentation is wrong, unclear, or missing.
title: "[Docs]: "
labels: ["docs", "triage"]
body:
  - type: input
    id: url
    attributes:
      label: Page URL or file
      description: Link to the docs page, or the path of the file under `docs/` or the README.
      placeholder: "docs/getting-started.md"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong
      description: Quote the text if you can, and say what is incorrect, unclear, or missing.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
